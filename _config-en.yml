# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: HuYongshuang
subtitle: ''
description: "HuYongshuang's blog website focuses on sharing technologies related to Minecraft's redstone, commands, servers, etc., as well as more technical content in areas such as mathematics, networks, and computers. Infinite creation, infinite possibilities."
keywords: HuYongshuang, Minecraft, Redstone, Commands, Hexo, Blog
author: HuYongshuang
language: en  # 英文网站
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://huyongshuang.top/en/  # 网站网址
root: /en/  # 网站根目录
permalink: :year/:i_month/:i_day-:title/  # 永久链接格式
permalink_defaults:
pretty_urls:
  trailing_index: false  # 是否在永久链接中保留尾部的 index.html，设置为 false 时去除
  trailing_html: false  # 是否在永久链接中保留尾部的 .html，设置为 false 时去除，对尾部的 index.html 无效

# Directory
source_dir: source-en  # 英文网站资源文件夹
public_dir: public/en  # 英文静态网站文件夹
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:  # 跳过渲染
  - "html/*/**"
  - "_posts/**/*.yml"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true  # 启用资源文件夹
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  exclude_languages: ['mermaid']
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
  exclude_languages: ['mermaid']

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 15
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:  # 忽略文件夹
#  - "**/source"
  - "source/**/*"

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: git
    repo: https://github.com/huyongshuang/huyongshuang.github.io.git
    branch: page
  - type: git
    repo: root@139.155.173.10:/blog/hexo.git
    branch: main

markdown:
  # 渲染器默认预设
  # "commonmark": 使用严格 CommandMark 规定.
  # "default": 默认配置, 类似于 GFM.
  # "zero": 禁用所有预设.
  preset: 'default'

  # 渲染选项
  render:
    # 是否解析 HTML 内容.
    # true: 解析 HTML 内容, false: 将 HTML 转义为文本.
    html: true
    # 是否将 HTML 内容渲染为 XHTML 的形式 (XHTML 语法非常严格, 比如原 HTML 中的 <br> 标签必须要使用 <br/> 这样的形式进行 "自闭和") 可能会出现兼容性问题.
    xhtmlOut: false
    # 只适用 Hexo 默认的两个高亮插件禁用时
    # 为围栏代码块中语法定义选项渲染后自动添加 class 名前缀, 如 ---html 渲染为 <class="language-html">
    langPrefix: 'language-'
    # true 则将所有换行渲染为 <br> 标签
    # 这种行为不属于 CommandMark 和 GFM.
    breaks: true
    # true 则自动解析链接并添加为 <a> 标签, false 则将链接渲染为文本.
    linkify: true
    # 默认 true # 自动转义各种排版字符, 如 ©.
    typographer: true
    # 当 typographer 定义为 true 时, 自动转换引号, quotes: '“”‘’' 则表示将 "123" '123' 转换为 “123” ‘123’.
    quotes: '“”‘’'

  # 启用/禁用单独 Markdown 语法规则
  # 当 preset 定义渲染规则时:
  # "zero" 表示禁用所有规则而能单独启用规则.
  # "default" 表示启用所有规则, 所以只能禁用特定规则.
  # "commandmark" 将严格遵循 CommandMark 因此不能额外定义规则的启闭.
  enable_rules: []
  disable_rules: []

  # 内置/第三方插件选项
  plugins:
    - markdown-it-abbr  # 缩写注释  示例：*[HTML]: HyperText Markup Language
    - markdown-it-cjk-breaks  # 中日韩换行优化，消除多余空行
    - markdown-it-container  # 自定义提示容器（tip/warning/danger）  示例：:::tips 提示内容 :::
    - markdown-it-deflist  # 定义列表
    - markdown-it-emoji  # 表情符号  示例：:smile: :rocket:
    - markdown-it-footnote  # 脚注  示例：文本[^1] 文末 [^1]: 注释内容
    - markdown-it-ins  # 下划线  示例：++下划线文本++
    - markdown-it-mark  # 高亮文本标记  示例：==高亮文字==
    - markdown-it-sub  # 下标  示例：H~2~O
    - markdown-it-sup  # 上标  示例：X^2^

    - "@renbaoshuo/markdown-it-katex"  # 启用 katex 数学公式
    - markdown-it-attrs  # 使用大括号给 Markdown 追加 HTML 属性、class、id、自定义 data 属性
    - markdown-it-imsize  # 图片自定义宽高
    - name: markdown-it-task-lists  # GFM 标准任务列表
      options:
        enabled: true
        label: true
        labelAfter: true
    - name: markdown-it-anchor  # 标题锚点生成
      options:
        level: [1,2,3,4]
        uniqueSlugStartIndex: 1
        tabIndex: "-1"
        permalink: true
        permalinkClass: 'header-anchor'
        permalinkSpace: true
        permalinkSymbol: '⚓︎'
        permalinkBefore: false
    - name: markdown-it-table-of-contents  # 自动生成目录 TOC
      options:
        includeLevel: [1,2,3,4]
        containerClass: "post-toc"
        containerHeaderHtml: "<h1>目录</h1>"
        listType: "ul"
        useExistingIds: true

#  # 锚点配置
#  anchors:
#    level: 1  # 创建锚点的最低标题等级, 如 "2" 则表示从 H2 开始创建一直到 H6 (最后).
#    collisionSuffix: ''  # 锚点 ID 重复时为其添加的后缀.
#    permalink: true  # 如果为 true 则会在标题旁边创建一个包含永久链接的锚点标签.
#    permalinkClass: 'header-anchor'  # 永久链接锚点标签的 class 名.
#    permalinkSide: 'right'  # 锚点标签的位置, left / right.
#    permalinkSymbol: ' ⚓︎'  # 用于生成永久链接的符号
#    case: 1  # 将锚点转换为 (0)不转换; (1)为小写; (2)为大写.
#    separator: '-'  # 用于替换空格的符号, 默认为 "-".

  # 图像设置
  images:
    lazyload: true  # 图片自动添加 loading="lazy" 懒加载.
    prepend_root: true  # 相对图片路径拼接网站根目录.
    post_asset: true  # 适配 Hexo 文章资源文件夹图片.

  # 仅渲染行内文本（极少使用）
  inline: false  # https://markdown-it.github.io/markdown-it/#MarkdownIt.renderInline

aplayer:
  meting: true
  asset_inject: false

feed:
  enable: true
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true

nofollow:
  enable: true
  field: site
  exclude:
    - ''
    - ''

sitemap:
  path: 
    - sitemap.xml
    - sitemap.txt
  template: ./sitemap_template.xml
  template_txt: ./sitemap_template.txt
  rel: false
  tags: true
  categories: true

baidusitemap:
  path: baidusitemap.xml
