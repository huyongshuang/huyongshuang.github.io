# 全局页面配置
global:
  # 相册名称
  album_name: 壁纸
  # 封面图片路径
  cover_path: photos/2026-05-01-1.png
  # 相册描述
  album_desc: 电脑壁纸
  # 是否按最新日期在前排序
  new_first: true
  # 本地媒体根路径：完整路径 = local_media_path + id.ext
  local_media_path: photos/

# 本地媒体列表：日期从 id 中解析
