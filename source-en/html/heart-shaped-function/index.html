<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart-shaped Function</title>
    <link rel="icon" href="https://huyongshuang.github.io/img/favicon.ico">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <div class="header">
        <h1>Heart-shaped Function Graph</h1>
        <div class="function-display"> y = (x²)^(1/3) + 0.9 · (3.3 - x²)^(1/2) · sin(nπx) </div>
    </div>
    <div class="container">
        <div class="canvas-container">
            <canvas id="graphCanvas" width="860" height="400"></canvas>
            <div class="value-display"> Parameter n value: <span id="nValue">0.0</span>
            </div>
        </div>
        <div class="controls">
            <div class="parameter-control">
                <h3>Parameter n value control</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>n = 0</span>
                        <span id="currentN">0.0</span>
                        <span>n = 100</span>
                    </div>
                    <input type="range" id="nSlider" min="0" max="100" step="0.1" value="0">
                </div>
            </div>
            <div class="buttons">
                <button id="startResetBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg> Start </button>
                <button id="pauseContinueBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg> Pause </button>
            </div>
        </div>
    </div>
    <script src="./assets/script.js"></script>
</body>
</html>
