# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------
# 英文网站中 HTML 标签引用本地文件时请在链接开头处添加 /en/
# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo: /img/logo.png  # 导航栏 Logo 图片
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: false

menu:
  首页: / || fas fa-home
  归档||fas fa-archive:
    时间轴: /archives/ || fas fa-history
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
  链接: /link/ || fas fa-link
  列表||fas fa-list-ul:
    HTML: /html/ || fas fa-code
    页面: /pages/ || fas fa-book-open
    说说: /shuoshuo/ || fas fa-pen-to-square
  音乐馆: /music/ || fas fa-music
  更多||fas fa-heart:
    关于: /huyongshuang/ || fas fa-user
    相册: /album/ || fas fa-images
  留言板: /messageboard/ || fas fa-comment-dots

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: false
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: true  # 全屏显示代码块

# Social media links
# Formal:
#   icon: link || the description || color
social:  # 社交媒体链接
  fab fa-github: https://github.com/huyongshuang || Github || '#24292e'
  fas fa-envelope: 746059847@qq.com || Email || '#4a7dbe'
  fa-brands fa-bilibili: https://space.bilibili.com/400547411 || B站 || '#24292e'

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /img/favicon.ico  # 网站标签图标

avatar:
  img: /img/avatar.png  # 博主头像
  effect: false

# Disable all banner images
disable_top_img: false

# If the banner of page not setting, it will show the default_top_img
default_top_img: /img/default_img.png  # 默认横幅图片

# The banner image of index page
index_img: /img/index_img.png  # 主页横幅图片

# The banner image of archive page
archive_img:

# Note: tag page, not tags page
tag_img:

# The banner image of tag page, you can set the banner image for each tag
# Format:
#  - tag name: xxxxx
tag_per_img:

# Note: category page, not categories page
category_img:

# The banner image of category page, you can set the banner image for each category
# Format:
#  - category name: xxxxx
category_per_img:

# The background image of footer
footer_img: true  # 显示与 top_img 一致

# Website Background
# Can set it to color, image URL or an array containing colors and/or image URLs
# If an array is provided, a random background will be selected from the array on each load
background:  # 网站背景
  - /img/background_1.png
  - /img/background_2.png

cover:
  # Disable the cover or not
  index_enable: true
  aside_enable: true
  archives_enable: true
  # When cover is not set, the default cover is displayed
  default_cover:
    # - xxx.jpg

# Replace Broken Images
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: false
  subtitle: 'Page Not Found'
  background: /img/image.png

post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: created
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true  # 主页显示文章标签
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
index_top_img_height:

# The subtitle on homepage
subtitle:
  enable: true  # 启用首页副标题
  # Typewriter Effect
  effect: true
  # Customize typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # Source - Call the third-party service API (Chinese only)
  # It will show the source first, then show the content of sub
  # Choose: false/1/2/3
  # false - disable the function
  # 1 - hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com
  source: 1  # 调用一言网的一句话
  # If you close the typewriter effect, the subtitle will only show the first line of sub
  sub:  # 自定义副标题
    - 他们应该多听，少说，对差异满怀激情，热爱那些不同于他们的想法。
    - 你站在桥上看风景，看风景的人在楼上看你。明月装饰了你的窗子，你装饰了别人的梦。
    - 过去都是假的，回忆是一条没有归途的路，以往的一切春天都无法复原，即使最狂热最坚贞的爱情，归根结底也不过是一种瞬息即逝的现实，唯有孤独永恒。
    - 所有的大人都曾经是小孩，虽然只有少数人记得。
    - 其实人跟树是一样的，越是向往高处的阳光，它的根就越要伸向黑暗的地底。
    - 死亡不是失去生命，而是走出了时间。
    - 我们所度过的每个平凡的日常，也许就是连续发生的奇迹。
    - 世界上只有一种英雄主义，就是在认清生活的真相后依然热爱生活。
    - 别让任何人消耗你内心的晴朗，生活应该是被热爱的人和事填满。
    - 所有的惊艳，都来自长久的准备；所有的幸运，都源于不懈的努力。

# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 3

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 2  # 如果存在描述，将显示描述，否则显示自动摘要
  # If you set method to 2 or 3, the length need to config
  length: 1000  # 配置长度

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: false  # 不显示章节数
  expand: true  # 展开 TOC
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: true
  text: 感谢您的支持！
  QR_code:
    - img: /img/weixin_pay.png
      link:
      text: 微信
    - img: /img/alipay.png
      link:
      text: 支付宝

# Post edit
# Easily browse and edit blog source code online.
post_edit:  # 在线浏览和编辑博客源代码
  enable: true
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url: https://github.com/huyongshuang/huyongshuang.github.io/tree/main/source/

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# Displays outdated notice for a post
noticeOutdate:
  enable: true  # 显示文章过期通知
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 365
  # Position: top / bottom
  position: top
  message_prev: 自上次更新已经过了
  message_next: 天，文章内容可能已经过时。

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  nav:  # 页脚设置
    - content:
      - title: 博客
        item:
          - title: 音乐馆
            url: /music/
          - title: 相册
            url: /album/
          - title: 链接
            url: /link/
          - title: HTML
            url: /html/
          - title: 页面
            url: /pages/
          - title: 说说
            url: /shuoshuo/
    - content:
      - title: 视频主页
        item:
          - title: 抖音
            url: https://v.douyin.com/USq91Jn
          - title: 哔哩哔哩
            url: https://space.bilibili.com/400547411
          - title: 腾讯视频
            url: https://v.qq.com/s/videoplus/9000237633/2
          - title: 爱奇艺
            url: https://www.iqiyi.com/creator/1569044152
          - title: 优酷
            url: https://www.youku.com/profile/index/?uid=UNjM1OTIyMDI0MA==
          - title: 搜狐视频
            url: https://tv.sohu.com/user/334351365
    - content:
      - title: 网站支持
        item:
          - title: GitHub
            url: https://github.com
          - title: 豆包
            url: https://www.doubao.com
          - title: DeepSeek
            url: https://www.deepseek.com
          - title: GitHub Pages
            url: https://huyongshuang.github.io
          - title: 旧版博客
            url: https://huyongshuang.github.io/old
          - title: 博客仓库 (GitHub)
            url: https://github.com/huyongshuang/huyongshuang.github.io
    - content:
      - title: Language
        item:
          - title: English
            html: <a href="/en/" class="lang-switch">English</a>
          - title: 中文
            html: <a href="/" class="lang-switch">中文</a>
  owner:
    enable: true
    since: 2020
  # Copyright of theme and framework
  copyright:
    enable: true
    version: true
  custom_text: |
    <style>
      .beian {display: flex; flex-direction: row; gap: 20px; justify-content: center; align-items: center;}
      .beian a {text-decoration: none;}
      .beian .police-beian {display: inline-flex; align-items: center;}
      .beian img {height: 15px; margin-right: 5px; vertical-align: middle;}
      @media(max-width:768px) {.beian{flex-direction: column; gap: 2.5px;}}
    </style>
    <div class="beian">
      <a href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank">鄂ICP备2026000237号-2</a>
      <a class="police-beian" href="https://beian.mps.gov.cn/#/query/webSearch?code=42062402000234" target="_blank">
        <img src="/img/beian.png" alt="备案图标">
        <span>鄂公网安备42062402000234号</span>
      </a>
    </div>
    <style>
      a#upyun {display: inline-flex; align-items: center; text-decoration: none;}
      #upyun img {height: 27px; margin-left: 2px; margin-right: 2px; vertical-align: middle;}
      #upyun span {vertical-align: middle;}
    </style>
    <a id="upyun" href="https://www.upyun.com/?utm_source=lianmeng&utm_medium=referral" target="_blank">
      本网站由<img src="/img/又拍云_logo2.png" alt="又拍云"><span>提供 CDN 加速服务</span>
    </a>

# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
  # Show the button to hide the aside in bottom right button
  button: true
  mobile: true
  # Position: left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:  # 作者信息卡片
    enable: true
    description: 创造，为了更好的生存。
    button:
      enable: true
      icon: fas fa-user
      text: 关于
      link: /huyongshuang
  card_announcement:  # 公告卡片
    enable: true
    content: |
      <div style="text-align:center; margin:-10px -30px -15px;">
        <p>微信公众号里面有更多内容！</p>
        <a href="https://mp.weixin.qq.com/s/Qd5I_aZf2vZh5WhoLE8czQ" target="_blank">
          <img src="/img/weixin_gongzhong.png" alt="微信公众号" style="width:250px; height:auto; margin-top:-15px;">
        </a>
      </div>
  card_recent_post:  # 最近文章卡片（2）
    enable: true
    # If set 0 will show all
    limit: 5
    # Sort: date / updated
    sort: date
    sort_order: 2
  card_newest_comments:  # 最新评论卡片（6）
    enable: false
    sort_order: 6
    limit: 6
    # Unit: mins, save data to localStorage
    storage: 10
    avatar: true
  card_categories:  # 分类卡片（5）
    enable: true
    # If set 0 will show all
    limit: 8
    # Choose: none / true / false
    expand: none
    sort_order: 5
  card_tags:  # 标签卡片（4）
    enable: true
    # If set 0 will show all
    limit: 40
    color: false
    custom_colors:
    # Order of tags, random/name/length
    orderby: random
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: 1
    sort_order: 4
  card_archives:  # 归档卡片（3）
    enable: true
    # Type: monthly / yearly
    type: monthly
    # Eg: YYYY年MM月
    format: MMMM YYYY
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
    # If set 0 will show all
    limit: 8
    sort_order: 3
  card_post_series:  # 系列文章卡片（1）
    enable: true
    # The title shows the series name
    series_title: false
    # Order by title or date
    orderBy: 'date'
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
    sort_order: 1
  card_webinfo:  # 网站信息卡片（7）
    enable: true
    post_count: true
    last_push_date: true
    sort_order: 7
    # Time difference between publish date and now
    # Formal: Month/Day/Year Time or Year/Month/Day Time
    # Leave it empty if you don't enable this feature
    runtime_date: 2001/10/01 13:14:00

# --------------------------------------
# Bottom right button
# --------------------------------------

# The distance between the bottom right button and the bottom (default unit: px)
rightside_bottom:

# Conversion between Traditional and Simplified Chinese
translate:
  enable: true
  # The text of a button
  default: 繁
  # the language of website (1 - Traditional Chinese/ 2 - Simplified Chinese）
  defaultEncoding: 2
  # Time delay
  translateDelay: 0
  # The text of the button when the language is Simplified Chinese
  msgToTraditionalChinese: '繁'
  # The text of the button when the language is Traditional Chinese
  msgToSimplifiedChinese: '简'

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  # Switch dark/light mode automatically
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am
  # autoChangeMode: false
  autoChangeMode: false
  # Set the light mode time. The value is between 0 and 24. If not set, the default value is 6 and 18
  start:
  end:

# Show scroll percent in scroll-to-top button
rightside_scroll_percent: true  # 在返回顶部按钮中显示滚动百分比

# Don't modify the following settings unless you know how they work
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment
# Don't repeat the same value
rightside_item_order:
  enable: false
  # Default: readmode,translate,darkmode,hideAside
  hide:
  # Default: toc,chat,comment
  show:

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  # When you scroll, the URL will update according to header id.
  auto_update: false
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # Add the copyright information after copied content
  copyright:
    enable: false
    limit_count: 150

# Need to install the hexo-wordcount plugin / 需要安装 hexo-wordcount 插件
wordcount:
  enable: true  # 启用字数统计
  # Display the word count of the article in post meta
  post_wordcount: true
  # Display the time to read the article in post meta
  min2read: true
  # Display the total word count of the website in aside's webinfo
  total_wordcount: true

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math
# --------------------------------------

# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use: katex  # 启用 katex 数学公式
  per_page: true
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

  katex:
    # Enable the copy KaTeX formula
    copy_tex: true  # 启用复制 KaTeX 公式功能

# --------------------------------------
# Search
# --------------------------------------

search:
  # Choose: algolia_search / local_search / docsearch
  # leave it empty if you don't need search
  use: local_search  # 启用搜索功能
  placeholder:

  # Algolia Search
  algolia_search:
    # Number of search results per page
    hitsPerPage: 6

  # Local Search
  local_search:
    # Preload the search data when the page loads.
    preload: true  # 预加载搜索数据
    # Show top n results per article, show all results by setting to -1
    top_n_per_article: -1  # 显示所有结果
    # Unescape html strings to the readable one.
    unescape: true  # 将 html 字符串解码为可读字符串
    # Enable pagination for search results
    pagination:
      enable: true  # 搜索结果启用分页
      # Number of search results per page
      hitsPerPage: 10
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
# --------------------------------------

share:
  # Choose: sharejs / addtoany
  # Leave it empty if you don't need share
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# Comments System
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Leave it empty if you don't need comments
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # Format of two comments system : Disqus,Waline
  use: Waline  # 使用 Waline 评论系统
  # Display the comment name next to the button
  text: true
  # Lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comment count will be invalid
  lazyload: false
  # Display comment count in post's top_img
  count: true  # 在文章顶部图片中显示评论计数
  # Display comment count in Home Page
  card_post_count: true  # 在主页显示评论计数

# Disqus
# https://disqus.com/
disqus:
  shortname:
  # For newest comments widget
  apikey:

# Alternative Disqus - Render comments with Disqus API
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  serverURLs:
  bg:
  # Use Valine visitor count as the page view count
  visitor: false
  option:

# Waline - A simple comment system with backend support fork from Valine
# https://waline.js.org/
waline:
  serverURL: https://comment.huyongshuang.top
  bg:
  # Use Waline pageview count as the page view count
  pageview: false
  option:
    emoji:
      - https://unpkg.com/@waline/emojis@1.4.0/qq
      - https://unpkg.com/@waline/emojis@1.4.0/weibo
      - https://unpkg.com/@waline/emojis@1.4.0/bilibili
      - https://unpkg.com/@waline/emojis@1.4.0/bmoji
      - https://unpkg.com/@waline/emojis@1.4.0/tieba
      - https://unpkg.com/@waline/emojis@1.4.0/tw-emoji
    requiredMeta: ['nick']
    noCopyright: false
    reaction: true
    reactionCount: true

# Utterances
# https://utteranc.es/
utterances:
  repo:
  # Issue Mapping: pathname/url/title/og:title
  issue_term: pathname
  # Theme: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook Comments Plugin
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # optional
  user_id:
  pageSize: 10
  # Choose: social / time / reverse_time
  order_by: social
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # Use Twikoo visitor count as the page view count
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

