# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# 导航设置
# --------------------------------------

nav:
  # 导航栏 Logo 图片
  logo: /img/logo.png
  display_title: true
  display_post_title: true
  # 是否固定导航栏
  fixed: false

menu:
  首页: / || fas fa-home
  归档 || fas fa-archive:
    时间轴: /archives/ || fas fa-history
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
  链接: /link/ || fas fa-link
  列表 || fas fa-list-ul:
    HTML: /html-pages/ || fas fa-code
  音乐馆: /music/ || fas fa-music
  更多 || fas fa-heart:
    关于: /about-me/ || fas fa-user
    相册: /album/ || fas fa-images
  留言板: /messageboard/ || fas fa-comment-dots

# --------------------------------------
# 代码块设置
# --------------------------------------

code_blocks:
  # 代码块主题: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # 代码块高度限制（单位: px）
  height_limit: false
  word_wrap: false

  # 工具栏
  copy: true
  language: true
  # true: 收缩代码块 | false: 展开代码块 | none: 展开代码块并隐藏按钮
  shrink: false
  fullpage: true

# 社交媒体链接
# 格式:
#   icon: 链接 || 描述 || 颜色
social:
  fab fa-github: https://github.com/huyongshuang || Github || '#24292e'
  fas fa-envelope: 746059847@qq.com || Email || '#4a7dbe'
  fa-brands fa-bilibili: https://space.bilibili.com/400547411 || B站 || '#24292e'

# --------------------------------------
# 图片设置
# --------------------------------------

favicon: /img/favicon.ico

avatar:
  img: /img/avatar.png
  effect: false

# 禁用所有横幅图片
disable_top_img: false

# 如果页面未设置横幅，则显示默认的横幅图片
default_top_img: /img/default_img.png

# 主页的横幅图片
index_img: /img/index_img.png

# 归档页的横幅图片
archive_img:

# 注意: 是标签页（单个标签），不是标签页面（所有标签）
tag_img:

# 标签页的横幅图片，可以为每个标签设置横幅图片
# 格式:
#  - 标签名: 图片链接
tag_per_img:

# 注意: 是分类页（单个分类），不是分类页面（所有分类）
category_img:

# 分类页的横幅图片，可以为每个分类设置横幅图片
# 格式:
#  - 分类名: 图片链接
category_per_img:

# 页脚的背景图片
footer_img: true

# 网站背景
# 可以设置为颜色或图片URL，或包含颜色和/或图片URL的数组
# 如果提供了数组，每次加载时都会从该数组中随机选择一个背景
background:
    - /img/background_1.png
    - /img/background_2.png

cover:
  # 是否显示文章封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 当未设置封面时，将显示默认封面
  default_cover:
    # - xxx.jpg

# 替换损坏的图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 简单的 404 页面
error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: /img/image.png

post_meta:
  # 主页页面
  page:
    # 日期类型: created / updated / both
    date_type: created
    # 日期格式: date / relative
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    # 元数据位置: left / center
    position: left
    # 日期类型: created / updated / both
    date_type: both
    # 日期格式: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------

# 首页头图的设置
# 默认: 头图全屏，站点信息在中间
# 站点信息的位置，例如: 300px/300em/300rem/10%
index_site_info_top:
# 头图的高度，例如: 300px/300em/300rem
index_top_img_height:

# 首页的副标题设置
subtitle:
  enable: true
  # 是否启用打字机效果
  effect: true
  # 自定义 typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # Source - 调用第三方服务 API（仅限中文）
  # 它将首先显示来源，然后显示副标题内容
  # 选择: false/1/2/3
  # false - 禁用此功能
  # 1 - 调用一言网的一句话（简体） https://hitokoto.cn/
  # 2 - 调用一句网（简体） http://yijuzhan.com/
  # 3 - 调用今日诗词（简体） https://www.jinrishici.com/
  source: 1
  # 如果关闭打字机效果，副标题将仅显示 sub 的第一行内容
  sub:
    - 他们应该多听，少说，对差异满怀激情，热爱那些不同于他们的想法。
    - 你站在桥上看风景，看风景的人在楼上看你。明月装饰了你的窗子，你装饰了别人的梦。
    - 过去都是假的，回忆是一条没有归途的路，以往的一切春天都无法复原，即使最狂热最坚贞的爱情，归根结底也不过是一种瞬息即逝的现实，唯有孤独永恒。
    - 所有的大人都曾经是小孩，虽然只有少数人记得。
    - 其实人跟树是一样的，越是向往高处的阳光，它的根就越要伸向黑暗的地底。
    - 死亡不是失去生命，而是走出了时间。
    - 我们所度过的每个平凡的日常，也许就是连续发生的奇迹。
    - 世界上只有一种英雄主义，就是在认清生活的真相后依然热爱生活。
    - 别让任何人消耗你内心的晴朗，生活应该是被热爱的人和事填满。
    - 所有的惊艳，都来自长久的准备；所有的幸运，都源于不懈的努力。

# 首页文章布局
# 1: 封面在左，信息在右
# 2: 封面在右，信息在左
# 3: 封面和信息左右交替显示
# 4: 封面在上，信息在下
# 5: 信息显示在封面上
# 6: 瀑布流布局 - 封面在上，信息在下
# 7: 瀑布流布局 - 信息显示在封面上
index_layout: 3

# 在首页显示文章简介
# 1: 描述
# 2: 两者（如果存在描述，将显示描述，否则显示自动摘要）
# 3: 自动摘要（默认）
# false: 不显示文章简介
index_post_content:
  method: 2
  # 如果设置 method 为 2 或 3，需要配置长度
  length: 1000

# --------------------------------------
# 文章设置
# --------------------------------------

toc:
  post: true
  page: false
  number: false
  expand: true
  # 仅适用于文章
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞助/打赏
reward:
  enable: true
  text: 感谢您的支持！
  QR_code:
    - img: /img/weixin_pay.png
      link:
      text: 微信
    - img: /img/alipay.png
      link:
      text: 支付宝

# 文章编辑
# 轻松在线浏览和编辑博客源代码
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # 例如: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# 相关文章
related_post:
  enable: true
  # 显示的文章数量
  limit: 6
  # 选择: created / updated
  date_type: created

# 选择: 1 / 2 / false
# 1: “下一篇文章”将链接到旧文章
# 2: “下一篇文章”将链接到新文章
# false: 禁用分页
post_pagination: 2

# 显示文章过期通知
noticeOutdate:
  enable: true
  # 样式: simple / flat
  style: flat
  # 多少天后显示通知
  limit_day: 365
  # 位置: top / bottom
  position: top
  message_prev: 自上次更新已经过了
  message_next: 天，文章内容可能已经过时。

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  nav:
    - width:
      content:
        - title: 博客
          item:
            - title: 音乐馆
              url: /music/
            - title: 相册
              url: /album/
            - title: 链接
              url: /link/
            - title: HTML
              url: /html-pages/
    - content:
      - title: 视频主页
        item:
          - title: 抖音
            url: https://v.douyin.com/USq91Jn
          - title: 哔哩哔哩
            url: https://space.bilibili.com/400547411
          - title: 腾讯视频
            url: https://v.qq.com/s/videoplus/9000237633/2
          - title: 爱奇艺
            url: https://www.iqiyi.com/creator/1569044152
          - title: 优酷
            url: https://www.youku.com/profile/index/?uid=UNjM1OTIyMDI0MA==
          - title: 搜狐视频
            url: https://tv.sohu.com/user/334351365
    - content:
      - title: 网站支持
        item:
          - title: GitHub
            url: https://github.com/
          - title: 豆包
            url: https://www.doubao.com/
          - title: DeepSeek
            url: https://www.deepseek.com/
          - title: GitHub Pages
            url: https://huyongshuang.github.io/
          - title: 旧版
            url:
          - title: Blog 仓库（GitHub）
            url: https://github.com/huyongshuang/huyongshuang.github.io
    - content:
      - title: 语言
        item:
          - title: English
            html: <a href="/en/" class="lang-switch">English</a>
          - title: 中文
            html: <a href="/" class="lang-switch">中文</a>
  owner:
    enable: true
    since: 2020
  # 主题和框架的版权声明
  copyright:
    enable: true
    version: true
  custom_text: |
    <style>
      .beian {display: flex; flex-direction: row; gap: 20px; justify-content: center; align-items: center}
      .beian a {text-decoration: none}
      .beian .police-beian {display: inline-flex; align-items: center}
      .beian img {height: 15px; margin-right: 5px; vertical-align: middle}
      @media(max-width:768px) {.beian{flex-direction: column; gap: 2.5px}}
    </style>
    <div class="beian">
      <a href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank">鄂ICP备2026000237号-2</a>
      <a class="police-beian" href="https://beian.mps.gov.cn/#/query/webSearch?code=42062402000234" target="_blank">
        <img src="/img/beian.png" alt="备案图标">
        <span>鄂公网安备42062402000234号</span>
      </a>
    </div>
    <style>
      a {display: inline-flex; align-items: center; text-decoration: none;}
      a img {height: 27px; margin-left: 2px; margin-right: 2px; vertical-align: middle;}
      a span {vertical-align: middle;}
    </style>
    <a href="https://www.upyun.com/?utm_source=lianmeng&utm_medium=referral" target="_blank">
      本网站由<img src="/img/又拍云_logo2.png" alt="又拍云"><span>提供CDN加速服务</span>
    </a>

# --------------------------------------
# 侧边栏设置
# --------------------------------------

aside:
  enable: true
  hide: false
  # 是否在右下角显示隐藏侧边栏的按钮
  button: true
  mobile: true
  # 侧边栏位置：left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:  # 作者信息卡片
    enable: true
    description: 创造，为了更好的生存。
    button:
      enable: true
      icon: fas fa-user
      text: 关于
      link: /about-me/
  card_announcement:  # 公告卡片
    enable: true
    content: |
      <div style="text-align:center; margin:-10px -30px -15px;">
        <p>微信公众号里面有更多内容！</p>
        <a href="https://mp.weixin.qq.com/s/Qd5I_aZf2vZh5WhoLE8czQ" target="_blank">
          <img src="/img/weixin_gongzhong.png" alt="微信公众号" style="width:250px; height:auto; margin-top:-15px;">
        </a>
      </div>
  card_recent_post:  # 最近文章卡片（2）
    enable: true
    # 如果设置 0 将显示全部
    limit: 5
    # 排序方式: date / updated
    sort: date
    sort_order: 2
  card_newest_comments:  # 最新评论卡片（6）
    enable: true
    limit: 6
    # 单位：分钟，保存数据到 localStorage
    storage: 10
    avatar: true
    sort_order: 6
  card_categories:  # 分类卡片（5）
    enable: true
    # 如果设置 0 将显示全部
    limit: 8
    # 选择: none / true / false
    expand: none
    sort_order: 5
  card_tags:  # 标签卡片（4）
    enable: true
    # 如果设置 0 将显示全部
    limit: 40
    color: true
    custom_colors:
    # 标签排序方式: random/name/length
    orderby: random
    # 排序顺序：1 表示升序，-1 表示降序
    order: 1
    sort_order: 4
  card_archives:  # 归档卡片（3）
    enable: true
    # 归档类型: monthly / yearly
    type: monthly
    # 日期格式: YYYY年MM月
    format: MMMM YYYY
    # 排序顺序：1 表示升序，-1 表示降序
    order: -1
    # 如果设置 0 将显示全部
    limit: 8
    sort_order: 3
  card_post_series:  # 系列文章卡片（1）
    enable: true
    # 标题显示系列名称
    series_title: false
    # 排序方式：title 或 date
    orderBy: 'date'
    # 排序顺序：1 表示升序，-1 表示降序
    order: -1
    sort_order: 1
  card_webinfo:  # 网站信息卡片（7）
    enable: true
    post_count: true
    last_push_date: true
    sort_order: 7
    # 发布日期与当前日期的时间差
    # 格式：Month/Day/Year Time 或 Year/Month/Day Time
    # 如果不启用此功能，请留空
    runtime_date: 2001/10/01 13:14:00

# --------------------------------------
# 右下角按钮设置
# --------------------------------------

# 右下角按钮与底部的距离（默认单位：px）
rightside_bottom:

# 简繁转换设置
translate:
  enable: true
  # 按钮文本
  default: 繁
  # 网站语言（1 - 繁体中文 / 2 - 简体中文）
  defaultEncoding: 2
  # 转换延迟
  translateDelay: 0
  # 按钮在简体中文时的文本
  msgToTraditionalChinese: '繁'
  # 按钮在繁体中文时的文本
  msgToSimplifiedChinese: '简'

# 阅读模式
readmode: true

# 暗黑模式设置
darkmode:
  enable: true
  # 切换暗黑/明亮模式的按钮
  button: true
  # 是否自动切换暗黑/明亮模式
  # autoChangeMode: 1  跟随系统设置，如果系统不支持暗黑模式，则在晚上 6 点到早上 6 点之间切换暗黑模式
  # autoChangeMode: 2  在晚上 6 点到早上 6 点之间切换暗黑模式
  # autoChangeMode: false  不自动切换
  autoChangeMode: false
  # 设置明亮模式时间，值在 0 到 24 之间。如果未设置，默认值为 6 和 18
  start:
  end:

# 在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: true

# 对右下角按钮进行排序（不要修改以下设置，除非你知道它们的工作原理）
# 选择：readmode,translate,darkmode,hideAside,toc,chat,comment
# 不要重复相同的值
rightside_item_order:
  enable: false
  # 隐藏的默认项目：readmode,translate,darkmode,hideAside
  hide:
  # 显示的默认项目：toc,chat,comment
  show:

# 右下角配置按钮动画效果
rightside_config_animation: true

# --------------------------------------
# 全局设置
# --------------------------------------

anchor:
  # 滚动时，URL 将根据标题 ID 更新
  auto_update: true
  # 点击标题滚动并更新锚点
  click_to_scroll: true

photofigcaption: false

copy:
  enable: true
  # 在复制的内容后添加版权信息
  copyright:
    enable: true
    limit_count: 150

# 需要安装 hexo-wordcount 插件
wordcount:
  enable: true
  # 在文章元信息中显示字数统计
  post_wordcount: true
  # 在文章元信息中显示阅读时间
  min2read: true
  # 在侧边栏网站信息中显示总字数
  total_wordcount: true

# 不蒜子 PV / UV 统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# 数学公式设置
# --------------------------------------

# 关于 per_page
# 如果设置为 true，将在每个页面加载 mathjax/katex 脚本
# 如果设置为 false，将根据你的设置加载 mathjax/katex 脚本（在页面的 front-matter 中添加 'mathjax: true' 或者 'katex: true'）
math:
  # 选择：mathjax, katex
  # 如果不需要数学公式，保持为空
  use: mathjax
  per_page: true
  hide_scrollbar: false

  mathjax:
    # 启用上下文菜单
    enableMenu: true
    # 选择：all / ams / none，这控制是否对公式编号以及如何编号
    tags: none

  katex:
    # 启用复制 KaTeX 公式
    copy_tex: false

# --------------------------------------
# 搜索设置
# --------------------------------------

search:
  # 选择：algolia_search / local_search / docsearch
  # 如果不需要搜索功能，保持为空
  use: local_search
  placeholder:

  # Algolia 搜索
  algolia_search:
    # 每页搜索结果数量
    hitsPerPage: 6

  # 本地搜索
  local_search:
    # 页面加载时预加载搜索数据
    preload: true
    # 每篇文章显示的顶部 n 个搜索结果，设置为 -1 显示所有结果
    top_n_per_article: -1
    # 将 HTML 字符串反转义为可读内容
    unescape: false
    # 为搜索结果启用分页
    pagination:
      enable: true
      # 每页搜索结果数量
      hitsPerPage: 10
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享系统
# --------------------------------------

share:
  # 选择：sharejs / addtoany
  # 如果不需要分享功能，保持为空
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 评论系统
# --------------------------------------

comments:
  # 最多两个评论系统，第一个将作为默认显示
  # 如果不需要评论功能，保持为空
  # 选择：Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # 两个评论系统的格式：Disqus,Waline
  use: Waline
  # 按钮旁边显示评论系统名称
  text: true
  # 懒加载：评论系统将在评论元素进入浏览器视口时加载
  # 如果设置为 true，评论计数将无效
  lazyload: false
  # 在文章顶部图片中显示评论计数
  count: true
  # 在主页显示评论计数
  card_post_count: true

# Disqus
# https://disqus.com/
disqus:
  shortname:
  # 最新评论小部件的 API 密钥
  apikey:

# 使用 Disqus API 渲染评论的替代方案
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # 该配置适用于国内自定义域名用户，海外版本将自动检测（无需手动填写）
  serverURLs:
  bg:
  # 使用 Valine 的访客计数作为页面的访客量
  visitor: false
  option:

# Waline 评论插件配置，一个简单的评论系统，基于 Valine 开发，支持后端
# https://waline.js.org/
waline:
  serverURL: https://comment.huyongshuang.top
  bg:
  # 使用 Waline 的访客计数作为页面的访客量
  pageview: true
  option:
    emoji:
      - https://unpkg.com/@waline/emojis@1.4.0/qq
      - https://unpkg.com/@waline/emojis@1.4.0/weibo
      - https://unpkg.com/@waline/emojis@1.4.0/bilibili
      - https://unpkg.com/@waline/emojis@1.4.0/bmoji
      - https://unpkg.com/@waline/emojis@1.4.0/tieba
      - https://unpkg.com/@waline/emojis@1.4.0/tw-emoji
    requiredMeta: ['nick']
    noCopyright: false
    reaction: true
    reactionCount: true

# Utterances
# https://utteranc.es/
utterances:
  repo:
  # 问题映射方式，可选值：pathname/url/title/og:title
  issue_term: pathname
  # 主题: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook 评论插件配置
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # 可选
  user_id:
  pageSize: 10
  # 评论排序方式，可选值：social / time / reverse_time
  order_by: social
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # 使用 Twikoo 的访客计数作为页面的访客量
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# Remark42
# https://remark42.com/docs/configuration/frontend/
remark42:
  host:
  siteId:
  option:

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server:
  site:
  # 使用 Artalk 的访客计数作为页面的访客量
  visitor: false
  option:

# --------------------------------------
# 聊天服务配置
# --------------------------------------

chat:
  # 聊天服务类型，可选值：chatra/tidio/crisp
  # 如果不需要聊天功能则留空
  use: chatra
  # 推荐使用聊天按钮
  # 会在网站右下角创建一个按钮，并隐藏原始按钮
  rightside_button: true
  # 原始聊天按钮在向上滚动时显示，向下滚动时隐藏
  button_hide_show: false

# https://chatra.io/
chatra:
  id: eAytia8GjQfC5Mbih

# https://www.tidio.com/
tidio:
  public_key:

# https://crisp.chat/en/
crisp:
  website_id:

# --------------------------------------
# 分析服务配置
# --------------------------------------

# https://tongji.baidu.com/web/welcome/login
baidu_analytics: c2ee7ad807ec11f79b2e779adac6d8db

# https://analytics.google.com/analytics/web/
google_analytics:

# https://www.cloudflare.com/zh-tw/web-analytics/
cloudflare_analytics:

# https://clarity.microsoft.com/
microsoft_clarity:

# https://umami.is/
umami_analytics:
  enable: false
  # 对于自托管环境，请配置 Umami 实例的主机名
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud (API key) / self-hosted Umami (token)
    token:

# https://www.googletagmanager.com/
google_tag_manager:
  tag_id:
  # 可选
  domain:

# --------------------------------------
# 广告配置
# --------------------------------------

# Google Adsense
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# 手动插入广告配置
# 如果不需要广告则留空
ad:
  # 在首页每三个帖子后插入广告
  index:
  # 在侧边栏插入广告
  aside:
  # 在文章分页前插入广告
  post:

# --------------------------------------
# 站点验证配置
# --------------------------------------

site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  - name: baidu-site-verification
    content: b8339f0567f3c2c09e96a0b7b538df5f

# --------------------------------------
# 美化 / 效果
# --------------------------------------

# 主题颜色自定义
# 注意：颜色值必须用双引号，如 "#000"，否则可能会导致错误！

theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#8559fd"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0d0d0d"

# 分类和标签页面的用户界面设置
# 选择：index - 与主页 UI 相同 / default - 与归档 UI 相同
# 留空或设置为 index
category_ui:
tag_ui:

# UI元素的圆角处理
rounded_corners_ui: true

# 拉伸行使每行宽度相等
text_align_justify: false

# 为页眉和页脚添加遮罩
mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: true
  # source
  # 1. 全屏加载
  # 2. 进度条
  source: 1
  # pace 主题 (参见 https://codebyzach.github.io/pace/)
  pace_css_url: /css/center-atom.css

# 页面过渡效果
enter_transitions: true

# 默认显示模式 - light (默认) / dark
display_mode: light

# 美化文章内容的配置
beautify:
  enable: true
  # 指定美化的范围 (site 或 post)
  field: site
  # 指定标题前缀图标，如 '\f0c1'（fontawesome 的 icon 的 Unicode 数）
  title_prefix_icon:
  # 指定标题前缀图标的颜色，如 '#F47466'
  title_prefix_icon_color:

# 全局字体设置
# 除非您知道它们的工作原理，否则不要修改以下设置
font:
  global_font_size:
  code_font_size:
  font_family: Times New Roman, SimSun, Songti SC, Microsoft YaHei, serif
  code_font_family: Consolas, Menlo, Monaco, SimSun

# 网站标题和副标题的字体设置
blog_title_font:
  font_link:
  font_family:

# 分隔符图标的设置
hr_icon:
  enable: true
  # Font Awesome 图标的 unicode 值，如 '\3423'
  icon:
  icon_top:

# 打字机效果
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: true
  colorful: true
  shake: false
  mobile: true

# --------------------------------------
# 背景效果
# --------------------------------------

# canvas_ribbon
# 参见: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # ribbon 的大小
  size: 150
  # ribbon 的不透明度 (0 ~ 1)
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# Fluttering Ribbon
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# canvas_nest
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: true
  # 线条颜色，默认: '0,0,0'; RGB 值: (R,G,B).(注意: 使用 ',' 分隔.)
  color: '0,0,255'
  # 线条的不透明度 (0~1)
  opacity: 0.7
  # 背景的 z-index 属性
  zIndex: -1
  # 线条数量
  count: 99
  mobile: false

# 鼠标点击效果: 烟花
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 鼠标点击效果: 心形符号
click_heart:
  enable: false
  mobile: false

# 鼠标点击效果: 文字
clickShowText:
  enable: true
  text:
    - 前路漫漫皆坦途
    - 岁岁平安常欢喜
    - 前程似锦步步宽
    - 福运常伴日日安
    - 一生顺遂无烦忧
    - 前路星光 所得皆良
    - 不负韶华 步步生花
    - 山河无恙 喜乐常随
    - 行皆坦途 万事可期
    - 心有繁花 一路芳华
  fontSize: 12px
  random: true
  mobile: false

# --------------------------------------
# 灯箱设置
# --------------------------------------

# 选择: fancybox / medium_zoom
# https://github.com/francoischalifour/medium-zoom
# https://fancyapps.com/fancybox/
# 如果不需要灯箱效果，请留空
lightbox:

# --------------------------------------
# 标签插件设置
# --------------------------------------

# 系列
series:
  enable: true
  # 按标题或日期排序
  orderBy: 'title'
  # 排序方式。1, asc 为升序; -1, desc 为降序
  order: 1
  number: true

# ABCJS - ABC 音乐符号插件
# https://github.com/paulrosen/abcjs
abcjs:
  enable: true
  per_page: true

# Mermaid
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: true
  # 使用代码块编写 Mermaid 图表
  code_write: true
  # 内置主题: default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # 启用“在新标签页中打开”按钮，以便在单独的窗口中查看图表
  open_in_new_tab: true
  # 启用图表上的缩放和平移交互
  zoom_pan: true

# chartjs
# 参见 https://www.chartjs.org/docs/latest/
chartjs:
  enable: true
  # 除非你瞭解它们的工作原理，否则不要修改。
  # 默认设置仅在未指定 MD 语法时使用。
  # 图表的字体颜色
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # 图表的边框颜色
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # 雷达图和极区图的刻度标签背景颜色
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# Note - Bootstrap 提示框
note:
  # Note 标签样式值:
  #  - simple    bs-callout 旧警告样式。默认。
  #  - modern    bs-callout 新 (v2-v3) 警告样式。
  #  - flat      扁平提示框样式，带背景，如 Mozilla 或 StackOverflow。
  #  - disabled  禁用所有 Note 标签的 CSS 样式。
  style: flat
  icons: true
  border_radius: 3
  # 背景颜色偏移百分比 (modern: -12 | 12; flat: -18 | 6)。
  # 也应用于标签变量。此选项可与禁用的 Note 标签一起使用。
  light_bg_offset: 0

# --------------------------------------
# 其他设置
# --------------------------------------

# https://github.com/MoOx/pjax
pjax:
  enable: false
  # 排除指定页面不使用 pjax，如 '/music/'
  exclude:
    # - /xxxxxx/

# 注入 CSS 和脚本 (aplayer/meting)
aplayerInject:
  enable: true
  per_page: true

# Snackbar - Toast 通知
# https://github.com/polonel/SnackBar
# 位置: top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
snackbar:
  enable: true
  position: bottom-center
  # 浅色模式和深色模式下的通知背景颜色
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# Instant.page
# https://instant.page/
instantpage: true

# Lazyload
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: false
  # 使用浏览器的原生 lazyload 而不是 vanilla-lazyload
  native: false
  # 指定使用 Lazyload 的范围 (site 或 post)
  field: site
  placeholder:
  blur: false

# PWA
# 参见 https://github.com/JLHwung/hexo-offline
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open graph meta tags
# https://hexo.io/docs/helpers#open-graph
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: false
  # 网站的别名，用于结构化数据
  # 格式: ['name1', 'name2']
  alternate_name:

# 添加供应商前缀以确保兼容性
css_prefix: true

# Inject
# 插入代码到 head（在 '</head>' 标签之前）和底部（在 '</body>' 标签之前）
inject:
  head:
    - <link id="cursor_1" rel="stylesheet" href="/assets/cursor/cursor.css">  # 插入光标 1
    - <link id="cursor_2" rel="stylesheet" href="/assets/cursor/cursor-gif.css" disabled>  # 插入光标 2 但不启用
    - <link rel="stylesheet" href="/css/cursor-switch.css">  # 光标开关按钮样式
    - <link rel="stylesheet" href="/css/language.css">  # 语言切换按钮样式
    - <link rel="stylesheet" href="/css/time-widget.css">  # 自定义时间侧边栏样式
    - <link rel="stylesheet" href="/css/cover-fix.css">  # 文章封面修复
  bottom:
    - <script src="/assets/cursor/cursor-gif.js"></script>  # 插入光标 2
    - <script src="/js/cursor_1.js"></script>  # 光标 1 开关
    - <script src="/js/cursor_2.js"></script>  # 光标 2 开关
    - <script src="/js/language.js"></script>  # 语言切换
    - <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    - <script src="/js/snowflake.js"></script>  # 背景特效
    - <script src="/js/cursor-star.js"></script>  # 光标星星特效
    - <script src="/js/time-widget.js"></script>  # 自定义时间侧边栏
    - <script src="/assets/live2d-widget/autoload.js"></script>  # Live2D 看板娘
    - <div class="aplayer no-destroy" data-id="6603686444" data-server="netease" data-type="playlist" data-fixed="true" data-mini="true" data-autoplay="false"></div>

# CDN 设置
# 除非你知道它们的工作原理，否则不要修改以下设置
CDN:
  # 内部和第三方脚本的 CDN 提供商
  # 两者的选项：local/jsdelivr/unpkg/cdnjs/custom
  # 注意： Dev 版本只能使用 'local' 作为内部脚本
  # 注意：将第三方脚本设置为 'local' 时，需要安装 hexo-butterfly-extjs
  internal_provider: local
  third_party_provider: jsdelivr

  # 是否在 URL 中添加版本号，true 或 false
  version: true

  # 自定义格式
  # 例如：https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}
  custom_format:

