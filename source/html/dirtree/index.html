<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件目录树生成器</title>
    <meta name="description" content="一款文件目录树在线生成器，支持按文件名称或路径进行排除。">
    <meta name="keywords" content="胡永双,在线工具,文件目录树生成器">
    <link rel="icon" href="https://huyongshuang.github.io/img/favicon.ico">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="light-mode">
<div class="container">
    <header>
        <h1>文件目录树生成器</h1>
        <p class="subtitle">一款文件目录树在线生成器，支持按文件名称或路径进行排除。</p>
    </header>
    <main>
        <div class="controls">
            <button id="select-folder-btn" title="点击选择一个您电脑上的文件夹">选择文件夹</button>
            <input type="text" id="exclude-input" value=".git, node_modules, .idea, .vscode, .DS_Store, dist, build, coverage, __pycache__, logs, *.log" placeholder="排除项（用逗号,隔开）">
        </div>
        <div class="results-container">
            <div class="results-header">
                <h2>文件目录树结果</h2>
                <div id="view-controls" class="view-controls-panel" style="display: none;">
                    <div class="control-group">
                        <label for="depth-input">最大深度:</label>
                        <input type="number" id="depth-input" min="1" title="设置目录树显示的最大层级">
                    </div>
                    <div class="control-group control-group-wide">
                        <label for="limit-config-input">分层数量限制:</label>
                        <input type="text" id="limit-config-input" title="格式: 深度:数量,  *:默认值" placeholder="例如: 1:20, 3:5, *:10">
                    </div>
                    <button id="update-view-btn">更新视图</button>
                </div>
                <button id="copy-btn" title="点击复制下方的目录树文本">复制</button>
            </div>
            <div class="output-wrapper">
                <pre id="tree-output"><code>请先选择一个文件夹...</code></pre>
            </div>
        </div>
        <p id="compatibility-notice" class="notice" style="display: none;">
            <strong>浏览器不兼容：</strong>您的浏览器不支持文件系统访问API，请使用最新版 Edge 或 Chrome 浏览器。
        </p>
        <section id="info-section">
            <article id="manual">
                <h2>使用说明</h2>
                <ul>
                    <li>支持按文件名称或路径进行排除，已预置 Git、IDE 配置文件、构建产物等常见排除项。</li>
                    <li>支持深度控制、数量限制和高级排除规则。</li>
                </ul>
            </article>
        </section>
        <script src="./assets/script.js"></script>
        <footer>
            © <a href="https://github.com/huyongshuang/huyongshuang.github.io/tree/main/source/html/dirtree">GitHub</a>
        </footer>
    </main>
</div>
<button id="theme-toggle-btn" title="切换日间/夜间模式">
    <svg class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.106a.75.75 0 010 1.06l-1.591 1.59a.75.75 0 11-1.06-1.06l1.59-1.591a.75.75 0 011.06 0zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 01-1.06 0l-1.59-1.591a.75.75 0 111.06-1.06l1.591 1.59a.75.75 0 010 1.06zM12 21.75a.75.75 0 01-.75-.75v-2.25a.75.75 0 011.5 0v2.25a.75.75 0 01-.75.75zM5.106 17.834a.75.75 0 010-1.06l1.591-1.59a.75.75 0 011.06 1.06l-1.591 1.59a.75.75 0 01-1.06 0zM2.25 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3a.75.75 0 01-.75-.75zM6.106 5.106a.75.75 0 011.06 0l1.59 1.591a.75.75 0 01-1.06 1.06L6.106 6.166a.75.75 0 010-1.06z"></path></svg>
    <svg class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.463-.945.75.75 0 01.945.945A10.5 10.5 0 119.528 1.718z" clip-rule="evenodd"></path></svg>
</button>
</body>
</html>
